<header class="topbar" [class.is-minimal]="isMinimal()">
  <div class="topbar-inner">
    @if (isMinimal()) {
      <a routerLink="/" class="brand">
        <img src="/assets/logo.png" alt="Logo" />
        <h1>Backed Bliss</h1>
      </a>
    } @else {
      <a routerLink="/" class="brand">
        <img src="/assets/logo.png" alt="Logo" />
        <h1>Backed Bliss</h1>
      </a>
      <div class="topbar-actions">
        <div class="search-control" [class.is-open]="searchIsOpen()">
          @if (searchIsOpen()) {
            <input
              type="search"
              placeholder="Buscar productos"
              [value]="searchQuery()"
              (input)="updateSearch($event)"
              aria-label="Buscar productos"
            />
          }
          <button
            type="button"
            class="icon-button"
            (click)="toggleSearch()"
            [attr.aria-expanded]="searchIsOpen()"
            aria-label="Buscar productos"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="10.5" cy="10.5" r="6.5"></circle>
              <line x1="15.5" y1="15.5" x2="21" y2="21"></line>
            </svg>
          </button>
        </div>
        <div class="profile-container">
          <button type="button" class="icon-button" (click)="handleProfileClick()" aria-label="{{ isAuthenticated() ? 'Mi Perfil' : 'Ingresar' }}" [attr.aria-expanded]="dropdownOpen()">
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" class="auth-icon" [style.stroke]="isAuthenticated() ? '#ebc590' : 'currentColor'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="3.5"></circle>
              <path d="M5 21a7 7 0 0 1 14 0"></path>
            </svg>
          </button>
          @if (dropdownOpen()) {
            @if (isAuthenticated()) {
              <div class="dropdown-menu" (click)="closeDropdown()">
                <div class="dropdown-header">
                  <span>Hola, {{ currentUser()?.name || 'Usuario' }}</span>
                </div>
                <nav class="dropdown-nav">
                  <a routerLink="/profile" class="dropdown-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="8" r="4"></circle>
                      <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"></path>
                    </svg>
                    Mi perfil
                  </a>
                  <a routerLink="/history" class="dropdown-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                      <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Historial de pedidos
                  </a>
                </nav>
                <div class="dropdown-divider"></div>
                <button type="button" class="dropdown-item logout-btn" (click)="logOut()">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                  </svg>
                  Cerrar sesión
                </button>
              </div>
            } @else {
              <div class="dropdown-menu" (click)="closeDropdown()">
                <nav class="dropdown-nav">
                  <a routerLink="/login" class="dropdown-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                      <polyline points="10 17 15 12 10 7"></polyline>
                      <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                    Iniciar sesión
                  </a>
                  <a routerLink="/register" class="dropdown-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                      <circle cx="8.5" cy="7" r="4"></circle>
                      <line x1="20" y1="8" x2="20" y2="14"></line>
                      <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                    Registrarse
                  </a>
                </nav>
              </div>
            }
          }
        </div>
        <button
          type="button"
          class="icon-button carrito-toggle"
          (click)="toggleCart()"
          [attr.aria-expanded]="cartIsOpen()"
          aria-controls="panel-cart"
          aria-label="Carrito ({{ countItems() }})"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="20" r="1.5"></circle>
            <circle cx="18" cy="20" r="1.5"></circle>
            <path d="M2 3h3l2.4 11.5a2 2 0 0 0 2 1.5h7.8a2 2 0 0 0 1.9-1.4L21 7H6"></path>
          </svg>
          <span class="cart-count">{{ countItems() }}</span>
        </button>
        <app-cart></app-cart>
      </div>
    }
  </div>
</header>
