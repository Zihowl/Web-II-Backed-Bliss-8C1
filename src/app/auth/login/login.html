<div class="login-container">
  <article class="login-card">
    <div class="login-header">
      <h2>Inicia sesión</h2>
      <p class="login-subtitle">Accede a tu cuenta de Backed Bliss</p>
    </div>

    <form (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          class="form-input"
          [(ngModel)]="email"
          placeholder="tu@email.com"
          [class.has-error]="fieldErrors['email']"
        />
        @if (fieldErrors['email']) {
          <span class="field-error">{{ fieldErrors['email'] }}</span>
        }
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          class="form-input"
          [(ngModel)]="password"
          placeholder="••••••••"
          [class.has-error]="fieldErrors['password']"
        />
        @if (fieldErrors['password']) {
          <span class="field-error">{{ fieldErrors['password'] }}</span>
        }
      </div>

      <div class="forgot-link">
        <a routerLink="/forgot-password" class="link">¿Olvidaste tu contraseña?</a>
      </div>

      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }

      <button
        type="submit"
        class="submit-button"
        [disabled]="loading()"
      >
        @if (loading()) {
          <span class="loading-text">Ingresando...</span>
        } @else {
          <span>Entrar</span>
        }
      </button>
    </form>

    <div class="login-footer">
      <p>
        ¿No tienes cuenta?
        <a routerLink="/register" class="link">Regístrate aquí</a>
      </p>
    </div>
  </article>
</div>
