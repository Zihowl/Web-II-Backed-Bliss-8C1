<div class="auth-container">
  <form class="auth-card" (ngSubmit)="submit()">
    <h2>Restablecer contraseña</h2>
    <p class="auth-subtitle">Escribe tu nueva contraseña.</p>

    <div class="form-group">
      <label for="password" class="form-label">Nueva contraseña</label>
      <input id="password" type="password" name="password" class="form-input"
             [(ngModel)]="password" placeholder="Mínimo 8 caracteres" />
    </div>

    <div class="form-group">
      <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
      <input id="confirmPassword" type="password" name="confirmPassword" class="form-input"
             [(ngModel)]="confirmPassword" />
    </div>

    @if (message()) { <div class="success-message">{{ message() }}</div> }
    @if (error()) { <div class="error-message">{{ error() }}</div> }

    <button type="submit" class="submit-button" [disabled]="loading() || !token">
      {{ loading() ? 'Guardando...' : 'Actualizar contraseña' }}
    </button>

    <p class="auth-footer">
      <a routerLink="/login" class="link">Volver a iniciar sesión</a>
    </p>
  </form>
</div>
