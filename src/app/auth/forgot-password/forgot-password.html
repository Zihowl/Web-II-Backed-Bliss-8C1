<div class="auth-container">
  <form class="auth-card" (ngSubmit)="submit()">
    <h2>Recuperar contraseña</h2>
    <p class="auth-subtitle">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>

    <div class="form-group">
      <label for="email" class="form-label">Correo electrónico</label>
      <input id="email" type="email" name="email" class="form-input"
             [(ngModel)]="email" placeholder="correo@dominio.com" />
    </div>

    @if (message()) { <div class="success-message">{{ message() }}</div> }
    @if (error()) { <div class="error-message">{{ error() }}</div> }

    <button type="submit" class="submit-button" [disabled]="loading()">
      {{ loading() ? 'Enviando...' : 'Enviar enlace' }}
    </button>

    <p class="auth-footer">
      <a routerLink="/login" class="link">Volver a iniciar sesión</a>
    </p>
  </form>
</div>
